name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,serve]"
      # The estimator tests are self-contained simulations with known ground
      # truth, so CI needs no dataset download.
      - run: pytest -q
