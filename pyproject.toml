[project]
name = "uplift"
version = "0.1.0"
description = "Causal inference and uplift modelling on the Criteo Uplift Prediction dataset"
requires-python = ">=3.11"
dependencies = [
    "numpy<3",
    "pandas<3",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "statsmodels",
    "matplotlib",
    "scipy",
    "pyyaml",
    "tqdm",
    "tabulate",
]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]", "pydantic"]
genai = ["anthropic", "boto3", "python-dotenv"]
# httpx is required by starlette's TestClient, which the serving contract
# tests use. Without it those six tests error out rather than run, so it is a
# hard test dependency and not an optional convenience.
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
